<VirtualHost *:${PORT}>
    # Somente public/ fica exposto; app/, database/, .env etc. ficam inacessíveis
    DocumentRoot /var/www/html/public
    DirectoryIndex index.php

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # css/ e assets/ ficam na raiz do projeto (mesma estrutura do XAMPP)
    Alias /css /var/www/html/css
    Alias /assets /var/www/html/assets

    <Directory /var/www/html/css>
        Options -Indexes
        Require all granted
    </Directory>

    <Directory /var/www/html/assets>
        Options -Indexes
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
